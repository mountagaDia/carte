<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carte Mountaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Figtree:wght@400;500;600&family=Noto+Sans+JP:wght@400&display=swap">
<style>
/* Layout : la carte physique (recto blanc / verso ardoise, retournable) en tête, puis coordonnées, actions et QR codes */
:root {
  --bg: #eef0f4;
  --fg: #2f3542;
  --fg-soft: #6b7385;
  --surface: #ffffff;
  --line: #dde1e8;
  --slate: #717d99;
  --slate-deep: #5b6783;
  --paper: #fbfbfa;
  --ink: #4a4f59;
  --display: "Jost", "Avenir Next", "Avenir", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a22; --fg: #e7e9ee; --fg-soft: #a0a7b6; --surface: #1f2430; --line: #2e3442;
    --slate: #8590ab; --slate-deep: #5b6783;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a22; --fg: #e7e9ee; --fg-soft: #a0a7b6; --surface: #1f2430; --line: #2e3442;
  --slate: #8590ab; --slate-deep: #5b6783;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* --- Carte physique --- */
.flip { perspective: 1200px; cursor: pointer; border: 0; padding: 0; background: none; width: 100%; display: block; text-align: left; font: inherit; }
.flip:focus-visible { outline: 3px solid var(--slate); outline-offset: 4px; border-radius: 10px; }
.flip-inner { position: relative; width: 100%; aspect-ratio: 91 / 55; transition: transform .7s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.back .flip-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 16px 32px -18px rgba(30,40,60,.45); overflow: hidden;
}
.front { background: var(--paper); color: var(--ink); padding: 7% 8%; display: flex; flex-direction: column; }
.head { display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px; }
.place { display: flex; flex-direction: column; gap: 1px; margin-top: 4%; }
.place .city { font-family: var(--display); font-weight: 500; font-size: clamp(9px, 2.6vw, 12px); letter-spacing: .12em; white-space: nowrap; text-transform: uppercase; color: #42464f; display: flex; align-items: center; gap: 6px; }
.place .city svg { width: .95em; height: .95em; color: #b8902f; flex: none; }
.place .jp { font-family: var(--jp); font-size: clamp(8px, 2.2vw, 10px); color: #7a808c; letter-spacing: .2em; padding-left: calc(.95em + 6px); }
.logo-atl { width: 33%; max-width: 160px; height: auto; flex: none; }
.who { margin-top: auto; }
.title { font-family: var(--display); font-size: clamp(11px, 3.2vw, 14px); color: #7a808c; margin: 0; }
.name { font-family: var(--display); font-weight: 500; font-size: clamp(19px, 6vw, 27px); margin: 2px 0 0; letter-spacing: .01em; line-height: 1.1; color: #42464f; }
.kana { font-family: var(--jp); font-size: clamp(10px, 2.9vw, 13px); color: #7a808c; margin: 4px 0 0; letter-spacing: .08em; }
.bar { width: 14%; height: 4px; background: #6f737b; margin-top: 5%; }
.reverse { background: radial-gradient(120% 90% at 20% 30%, #26324a, #141b2a); color: #fff; transform: rotateY(180deg); padding: 7% 18% 7% 8%; display: flex; flex-direction: column; justify-content: space-between; }
.reverse::after { content: ""; position: absolute; top: 0; bottom: 0; right: 8%; width: 1.4%; background: linear-gradient(#3d8bf2, #c9ced8); }
.logo-htech { width: 30%; max-width: 128px; height: auto; }
.reverse .rt { font-family: var(--display); font-size: clamp(10px, 2.8vw, 12px); letter-spacing: .16em; text-transform: uppercase; color: #8fb6f5; margin: 0; }
.reverse .rb { font-family: var(--display); font-weight: 500; font-size: clamp(15px, 4.6vw, 21px); margin: 3px 0 0; line-height: 1.2; }
.reverse .rs { font-family: var(--display); font-size: clamp(10px, 2.8vw, 12px); color: #b9c0cc; margin: 4px 0 0; }
.tap { text-align: center; color: var(--fg-soft); font-size: 12px; margin: -12px 0 0; letter-spacing: .04em; }

/* --- Rôles et coordonnées --- */
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 18px; }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-soft); margin: 0 0 8px; font-weight: 600; }
.roles { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.roles li { line-height: 1.4; }
.roles b { font-weight: 600; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); min-width: 0; }
.rows li:first-child { border-top: 0; }
.rows svg { width: 18px; height: 18px; color: var(--slate); }
.rows .v { min-width: 0; overflow-wrap: anywhere; color: var(--fg); text-decoration: none; font-size: 14px; font-variant-numeric: tabular-nums; }
.rows .v small { display: block; color: var(--fg-soft); font-size: 12px; }
.rows a.v:hover { color: var(--slate); }
.copy { appearance: none; border: 0; background: none; color: var(--fg-soft); font: 500 12px var(--body); cursor: pointer; padding: 6px 4px; }
.copy:hover, .copy:focus-visible { color: var(--slate); }

/* --- Actions --- */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 12px; padding: 13px 12px; font: 600 14px var(--body); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--slate); }
.btn:focus-visible, details summary:focus-visible { outline: 3px solid var(--slate); outline-offset: 2px; }
.btn.primary { grid-column: 1 / -1; background: var(--slate-deep); border-color: var(--slate-deep); color: #fff; font-size: 15px; padding: 15px; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* --- QR codes --- */
.qrs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qr { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; justify-items: center; gap: 8px; text-align: center; }
.qr .code { background: #fff; padding: 8px; border-radius: 6px; }
.qr .code img, .qr .code canvas { display: block; width: 116px !important; height: 116px !important; }
.qr p { margin: 0; font-size: 13px; font-weight: 600; }
.qr .qlogo { height: 18px; width: auto; }
.qr span { font-size: 12px; color: var(--fg-soft); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }
</style>

    { poste: "Fondateur & DG", org: "Hamza Technologies (HTECH)" }
  ],
  telephones: [
    { label: "Japon", num: "+81 70 9105 8193" },
    { label: "Sénégal", num: "+221 77 813 98 74" }
  ],
  emails: [
    { label: "Atlantis", adr: "mountaga@atlantis-yokohama.com" },
    { label: "Personnel", adr: "diathiernomountaga@gmail.com" }
  ],
  siteAtlantis: "https://atlantis-yokohama.jp/",
  urlCarte: "https://mountagadia.github.io/carte/"   // adresse publique de la carte (QR « Cette carte » et bouton Partager)
};
/* ====================================== */

const $ = id => document.getElementById(id);
const nomAffiche = `${CARTE.nom} ${CARTE.prenom}`;
const brut = n => n.replace(/[^\d+]/g, "");
const ICON = {
  tel: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L20 7H4z"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>'
};

$("f-city").textContent = CARTE.ville;
$("f-cityjp").textContent = CARTE.villeJp;
$("f-title").textContent = CARTE.fonction;
$("f-name").textContent = nomAffiche;
$("f-kana").textContent = CARTE.kana;
$("b-role").textContent = CARTE.roles[1].poste;
$("b-company").textContent = CARTE.roles[1].org;
$("b-name").textContent = nomAffiche;
$("flip").addEventListener("click", function () { this.classList.toggle("back"); });

$("roles").innerHTML = CARTE.roles.map(r => `<li><b>${r.poste}</b> – ${r.org}</li>`).join("");

const rows = [
  ...CARTE.telephones.map(t => ({ icon: ICON.tel, href: `tel:${brut(t.num)}`, text: t.num, sub: t.label, copy: t.num })),
  ...CARTE.emails.map(e => ({ icon: ICON.mail, href: `mailto:${e.adr}`, text: e.adr, sub: e.label, copy: e.adr })),
  { icon: ICON.web, href: CARTE.siteAtlantis, text: CARTE.siteAtlantis.replace(/^https?:\/\/|\/$/g, ""), sub: "Site Atlantis", ext: true }
];
$("rows").innerHTML = rows.map((r, i) => `<li>${r.icon}<a class="v" href="${r.href}"${r.ext ? ' target="_blank" rel="noopener"' : ""}>${r.text}<small>${r.sub}</small></a>${r.copy ? `<button class="copy" type="button" data-i="${i}">Copier</button>` : "<span></span>"}</li>`).join("");
$("rows").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const txt = rows[b.dataset.i].copy;
  try { await navigator.clipboard.writeText(txt); toast("Copié"); } catch { toast(txt); }
});

$("call").href = `tel:${brut(CARTE.telephones[0].num)}`;
$("mail").href = `mailto:${CARTE.emails[0].adr}`;
$("qr-site").href = CARTE.siteAtlantis;

const pageUrl = CARTE.urlCarte || location.href;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600);
}

function vcard() {
  const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
  return [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${esc(CARTE.nom)};${esc(CARTE.prenom)};;;`,
    `FN:${esc(CARTE.prenom + " " + CARTE.nom)}`,
    `ORG:${esc(CARTE.entreprise)}`,
    `TITLE:${esc(CARTE.fonction)}`,
    ...CARTE.telephones.map((t, i) => `TEL;TYPE=CELL${i ? "" : ",PREF"}:${brut(t.num)}`),
    ...CARTE.emails.map((e, i) => `EMAIL;TYPE=INTERNET,${i ? "HOME" : "WORK,PREF"}:${e.adr}`),
    `URL:${CARTE.siteAtlantis}`,
    `NOTE:${esc(CARTE.roles.map(r => r.poste + " – " + r.org).join(" / "))}`,
    "END:VCARD"
  ].join("\r\n");
}

$("save").addEventListener("click", () => {
  const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "DIA_Thierno_Mountaga.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Ouvrez le fichier pour ajouter le contact");
});

$("share").addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share({ title: nomAffiche, text: `${nomAffiche}, ${CARTE.fonction}`, url: pageUrl }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(pageUrl); toast("Lien copié"); }
  catch { toast(pageUrl); }
});

if (window.QRCode) {
  const opts = text => ({ text, width: 232, height: 232, colorDark: "#2f3542", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  new QRCode($("qr-atlantis"), opts(CARTE.siteAtlantis));
  new QRCode($("qr-card"), opts(pageUrl));
}
</script>

</html>
